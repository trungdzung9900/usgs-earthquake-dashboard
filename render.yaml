services:
  # ── Backend (NestJS) ─────────────────────────────────────────────────────────
  - type: web
    name: usgs-eq-backend
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build --workspace=backend
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Set this to your Render frontend URL after the first deploy, e.g.:
      # https://usgs-eq-frontend.onrender.com
      - key: FRONTEND_URL
        value: https://usgs-eq-frontend.onrender.com

  # ── Frontend (Vite static site) ───────────────────────────────────────────────
  - type: web
    name: usgs-eq-frontend
    runtime: static
    region: singapore
    plan: free
    buildCommand: npm install && npm run build --workspace=frontend
    staticPublishPath: frontend/dist
    envVars:
      # Must match the backend service URL above
      - key: VITE_API_BASE_URL
        value: https://usgs-eq-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
